<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Birthday 3D</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
background:black;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:5;
pointer-events:none;
}

.card{
width:900px;
height:520px;
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
border-radius:30px;
box-shadow:
0 0 50px rgba(255,0,255,0.2),
0 0 120px rgba(0,255,255,0.12);
padding:40px;
display:flex;
gap:30px;
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
width:300px;
height:300px;
background:rgba(255,0,255,0.15);
filter:blur(100px);
top:-100px;
right:-100px;
border-radius:50%;
}

.left{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
z-index:2;
}

.left h1{
font-size:58px;
line-height:1.1;
color:white;
margin-bottom:20px;
text-shadow:0 0 20px rgba(255,255,255,0.5);
}

.left span{
background:linear-gradient(90deg,#ff00ff,#00ffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.left p{
font-size:18px;
color:#ddd;
line-height:1.7;
max-width:400px;
}

.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
z-index:2;
}

.photo{
width:220px;
height:340px;
border-radius:25px;
overflow:hidden;
position:relative;
transform-style:preserve-3d;
animation:float 4s ease-in-out infinite;
box-shadow:
0 0 25px rgba(255,255,255,0.15),
0 0 50px rgba(0,255,255,0.15);
}

.photo:nth-child(2){
margin-top:60px;
animation-delay:1s;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
transition:1s;
}

.photo:hover img{
transform:scale(1.08);
}

.photo::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,0.6),
transparent 40%
);
}

.label{
position:absolute;
bottom:18px;
left:18px;
color:white;
font-size:15px;
font-weight:600;
z-index:5;
}

@keyframes float{

0%,100%{
transform:translateY(0px) rotate(-2deg);
}

50%{
transform:translateY(-18px) rotate(2deg);
}

}

.music{
position:absolute;
bottom:25px;
left:40px;
color:#aaa;
font-size:14px;
z-index:3;
}

.glow{
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,
rgba(0,255,255,0.12),
transparent 70%);
top:-200px;
left:-200px;
filter:blur(60px);
}

@media(max-width:950px){

.card{
width:95%;
height:auto;
flex-direction:column;
padding:30px;
}

.right{
flex-direction:column;
}

.left h1{
font-size:42px;
}

.photo:nth-child(2){
margin-top:0;
}

}

</style>
</head>

<body>

<div class="overlay">

<div class="card">

<div class="glow"></div>

<div class="left">

<h1>
Happy Birthday
<span>Bestie 🎂</span>
</h1>

<p>
Semoga panjang umur, makin cantik/ganteng,
dan hidupnya gak se-random coding JavaScript jam 2 pagi 😭
</p>

<div class="music">
🎵 put your favorite song here
</div>

</div>

<div class="right">

<div class="photo">
<img src="foto1.jpg">
<div class="label">Memory 01</div>
</div>

<div class="photo">
<img src="foto2.jpg">
<div class="label">Memory 02</div>
</div>

</div>

</div>

</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 30;

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

const particlesGeometry = new THREE.BufferGeometry();

const count = 7000;

const positions = new Float32Array(count * 3);

for(let i=0;i<count*3;i++){

positions[i] = (Math.random()-0.5)*200;

}

particlesGeometry.setAttribute(
'position',
new THREE.BufferAttribute(positions,3)
);

const particlesMaterial = new THREE.PointsMaterial({
size:0.15,
color:'#ffffff'
});

const particlesMesh = new THREE.Points(
particlesGeometry,
particlesMaterial
);

scene.add(particlesMesh);

const torus = new THREE.Mesh(

new THREE.TorusGeometry(10,0.3,16,100),

new THREE.MeshStandardMaterial({
color:'#00ffff',
emissive:'#00ffff',
emissiveIntensity:1
})

);

scene.add(torus);

const torus2 = new THREE.Mesh(

new THREE.TorusGeometry(14,0.15,16,100),

new THREE.MeshStandardMaterial({
color:'#ff00ff',
emissive:'#ff00ff',
emissiveIntensity:1
})

);

torus2.rotation.x = 1.5;

scene.add(torus2);

const light = new THREE.PointLight(
0xffffff,
2
);

light.position.set(20,20,20);

scene.add(light);

const ambient = new THREE.AmbientLight(
0xffffff,
0.6
);

scene.add(ambient);

function animate(){

requestAnimationFrame(animate);

particlesMesh.rotation.y += 0.0007;

torus.rotation.x += 0.005;
torus.rotation.y += 0.008;

torus2.rotation.y -= 0.005;
torus2.rotation.z += 0.003;

renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
