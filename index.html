<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
background:#0f1020;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.intro{
position:fixed;
inset:0;
z-index:9999;
background:
linear-gradient(
135deg,
#ff8dc7,
#9f7bff,
#6be7ff
);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
animation:introOut 1.5s ease forwards;
animation-delay:6s;
}

.cloud{
position:absolute;
background:rgba(255,255,255,.25);
filter:blur(10px);
border-radius:999px;
animation:cloudMove linear infinite;
}

.cloud1{
width:260px;
height:80px;
top:90px;
left:-300px;
animation-duration:18s;
}

.cloud2{
width:180px;
height:60px;
bottom:140px;
right:-250px;
animation-duration:22s;
}

@keyframes cloudMove{

to{
transform:translateX(1800px);
}

}

.cake{
position:absolute;
bottom:-20px;
width:260px;
animation:cakeUp 2s ease forwards;
}

@keyframes cakeUp{

from{
transform:translateY(300px);
opacity:0;
}

to{
transform:translateY(0);
opacity:1;
}

}

.introContent{
position:relative;
z-index:5;
text-align:center;
padding:20px;
}

.introContent h1{
font-size:95px;
font-weight:800;
color:white;
line-height:1;
opacity:0;
transform:translateY(60px);
animation:titleIn 1.5s ease forwards;
animation-delay:.5s;
text-shadow:
0 10px 25px rgba(0,0,0,.15);
}

.introContent p{
margin-top:20px;
font-size:20px;
color:white;
letter-spacing:4px;
opacity:0;
animation:fadeIn 1.5s ease forwards;
animation-delay:1.4s;
}

.tap{
margin-top:40px;
display:inline-flex;
align-items:center;
gap:12px;
padding:15px 28px;
border-radius:999px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
color:white;
font-size:14px;
letter-spacing:3px;
border:1px solid rgba(255,255,255,.25);
opacity:0;
animation:fadeIn 1.5s ease forwards;
animation-delay:2.2s;
}

.tap span{
width:10px;
height:10px;
border-radius:50%;
background:white;
animation:blink 1s infinite;
}

@keyframes blink{

50%{
opacity:.3;
}

}

@keyframes titleIn{

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes fadeIn{

to{
opacity:1;
}

}

@keyframes introOut{

to{
opacity:0;
visibility:hidden;
}

}

.main{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
z-index:10;
opacity:0;
animation:showMain 2s ease forwards;
animation-delay:6.2s;
}

@keyframes showMain{

to{
opacity:1;
}

}

.card{
width:1200px;
height:670px;
border-radius:40px;
overflow:hidden;
position:relative;
display:flex;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(25px);
box-shadow:
0 0 50px rgba(255,255,255,.05),
0 0 120px rgba(255,105,180,.08);
}

.left{
width:45%;
padding:70px;
display:flex;
flex-direction:column;
justify-content:center;
position:relative;
z-index:5;
}

.small{
font-size:14px;
letter-spacing:5px;
color:#ffb8dd;
margin-bottom:20px;
}

.title{
font-size:90px;
line-height:.95;
font-weight:800;
color:white;
}

.title span{
background:linear-gradient(
90deg,
#ff9fd0,
#ffffff,
#ffd86f
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.desc{
margin-top:28px;
font-size:18px;
line-height:1.9;
color:#f0f0ff;
max-width:430px;
}

.bottom{
margin-top:45px;
display:flex;
align-items:center;
gap:14px;
font-size:14px;
letter-spacing:4px;
color:#ffd7ea;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#ffd86f;
box-shadow:0 0 12px #ffd86f;
}

.right{
width:55%;
display:flex;
justify-content:center;
align-items:center;
position:relative;
perspective:2000px;
}

.ring{
position:absolute;
width:550px;
height:550px;
border-radius:50%;
border:1px solid rgba(255,255,255,.08);
animation:spin 18s linear infinite;
}

.ring::before{
content:'';
position:absolute;
inset:35px;
border-radius:50%;
border:1px solid rgba(255,255,255,.04);
}

.photo{
position:absolute;
width:280px;
height:400px;
border-radius:35px;
overflow:hidden;
box-shadow:
0 25px 70px rgba(0,0,0,.45),
0 0 40px rgba(255,255,255,.08);
transition:1s;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
transition:1s;
}

.photo:hover img{
transform:scale(1.08);
}

.photo::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(0,0,0,.7),
transparent 45%
);
}

.photo1{
transform:
translateX(-140px)
rotateY(16deg)
rotateZ(-4deg);
animation:float1 6s ease-in-out infinite;
}

.photo2{
transform:
translateX(140px)
rotateY(-16deg)
rotateZ(4deg);
animation:float2 6s ease-in-out infinite;
}

.label{
position:absolute;
bottom:20px;
left:20px;
color:white;
font-size:15px;
font-weight:600;
letter-spacing:2px;
z-index:3;
}

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

@keyframes float1{

50%{
transform:
translateX(-140px)
translateY(-20px)
rotateY(13deg)
rotateZ(-2deg);
}

}

@keyframes float2{

50%{
transform:
translateX(140px)
translateY(-24px)
rotateY(-13deg)
rotateZ(2deg);
}

}

@media(max-width:1100px){

.card{
width:95%;
height:auto;
flex-direction:column;
}

.left,
.right{
width:100%;
}

.left{
padding:40px;
}

.title{
font-size:60px;
}

.right{
height:550px;
}

.photo{
width:220px;
height:320px;
}

}

</style>
</head>

<body>

<div class="intro">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<svg class="cake" viewBox="0 0 512 512" fill="none">
<path d="M110 370H402V430H110V370Z" fill="#fff"/>
<path d="M130 230H382V370H130V230Z" fill="#ffb6d9"/>
<path d="M150 180H362V230H150V180Z" fill="#fff0f5"/>
<rect x="185" y="120" width="20" height="60" rx="8" fill="#fff"/>
<rect x="245" y="120" width="20" height="60" rx="8" fill="#fff"/>
<rect x="305" y="120" width="20" height="60" rx="8" fill="#fff"/>
<circle cx="195" cy="105" r="12" fill="#ffd86f"/>
<circle cx="255" cy="105" r="12" fill="#ffd86f"/>
<circle cx="315" cy="105" r="12" fill="#ffd86f"/>
</svg>

<div class="introContent">

<h1>
HAPPY<br>BIRTHDAY 🎂
</h1>

<p>THIS PAGE IS MADE FOR YOU ✦</p>

<div class="tap">
<span></span>
LOADING SWEET MEMORIES
</div>

</div>

</div>

<div class="main">

<div class="card">

<div class="left">

<div class="small">
SPECIAL MOMENT
</div>

<div class="title">
BEST<br>
<span>MEMORIES</span>
</div>

<div class="desc">
Selamat ulang tahun 🎉  
Semoga hidup lu makin banyak bahagianya,
makin dikit drama randomnya,
dan semoga semua hal baik dateng terus ke hidup lu 😭
</div>

<div class="bottom">

<div class="dot"></div>

FOREVER MEMORY

</div>

</div>

<div class="right">

<div class="ring"></div>

<div class="photo photo1">
<img src="d1.jpg">
<div class="label">orang cantik </div>
</div>

<div class="photo photo2">
<img src="d2.jpg">
<div class="label">orang cantik </div>
</div>

</div>

</div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 35;

const renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

const geometry =
new THREE.BufferGeometry();

const count = 18000;

const positions =
new Float32Array(count*3);

for(let i=0;i<count*3;i++){

positions[i] =
(Math.random()-0.5)*500;

}

geometry.setAttribute(
'position',
new THREE.BufferAttribute(positions,3)
);

const material =
new THREE.PointsMaterial({
size:0.15,
color:"#ffffff"
});

const particles =
new THREE.Points(
geometry,
material
);

scene.add(particles);

const torus =
new THREE.Mesh(

new THREE.TorusKnotGeometry(
12,
0.35,
300,
32
),

new THREE.MeshStandardMaterial({
color:"#ff9fd0",
wireframe:true
})

);

scene.add(torus);

const crystal =
new THREE.Mesh(

new THREE.IcosahedronGeometry(
9,
1
),

new THREE.MeshStandardMaterial({
color:"#ffd86f",
wireframe:true
})

);

scene.add(crystal);

const light =
new THREE.PointLight(
0xffffff,
2
);

light.position.set(20,20,20);

scene.add(light);

const ambient =
new THREE.AmbientLight(
0xffffff,
0.5
);

scene.add(ambient);

function animate(){

requestAnimationFrame(animate);

particles.rotation.y += 0.0003;

torus.rotation.x += 0.002;
torus.rotation.y += 0.003;

crystal.rotation.y -= 0.002;
crystal.rotation.z += 0.001;

renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
